<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 72px;
            color: #4fc3f7;
            text-shadow: 0 0 30px rgba(79, 195, 247, 0.5);
            margin: 0 0 20px 0;
        }
        p {
            font-size: 32px;
            color: #aaa;
            margin: 0;
        }
        .cta {
            margin-top: 40px;
            padding: 20px 50px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="icon">💧</div>
    <h1>Colorado Well Finder</h1>
    <p>Know Your Well Depth Before You Drill</p>
    <div class="cta">Search Any Colorado Address</div>
</body>
</html>
